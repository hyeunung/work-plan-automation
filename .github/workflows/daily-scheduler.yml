name: HANSL Notion & Slack Automation Scheduler

on:
  workflow_dispatch:
    inputs:
      pipeline_type:
        description: '실행할 파이프라인 타입을 선택하세요.'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - daily-backfill
          - daily-reminder
          - weekly
          - weekly-resend
          - weekly-reminder
          - weekly-late-audit
          - smartfarm-weekly
          - overdue-tasks
          - project-sync
      start_date:
        description: '(daily-backfill 전용) 시작일 YYYY-MM-DD'
        required: false
        default: ''
        type: string
      end_date:
        description: '(daily-backfill 전용) 종료일 YYYY-MM-DD (비우면 시작일 하루만)'
        required: false
        default: ''
        type: string
      force:
        description: '(daily-backfill 전용) true=변동 없어도 전부 삭제 후 재게시 / false=변동 있는 날짜만'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'


jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브 저장소에 MD 파일을 자동으로 커밋/푸시하기 위해 쓰기 권한 활성화

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automation Pipeline
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WEEKLY_PLAN_DB_ID: ${{ secrets.NOTION_WEEKLY_PLAN_DB_ID }}
          NOTION_DAILY_WORK_LOG_DB_ID: ${{ secrets.NOTION_DAILY_WORK_LOG_DB_ID }}
          NOTION_TASKS_DB_ID: ${{ secrets.NOTION_TASKS_DB_ID }}
          NOTION_TEAM_MEMBERS_DB_ID: ${{ secrets.NOTION_TEAM_MEMBERS_DB_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_ADMIN_USER_ID: ${{ secrets.SLACK_ADMIN_USER_ID }}
          SLACK_CANVAS_ID_YUNHUI: ${{ secrets.SLACK_CANVAS_ID_YUNHUI }}
          SLACK_CANVAS_ID_HEESEUNG: ${{ secrets.SLACK_CANVAS_ID_HEESEUNG }}
          SLACK_CANVAS_ID_HYUNBIN: ${{ secrets.SLACK_CANVAS_ID_HYUNBIN }}
          SLACK_CANVAS_ID_SEUNGHOO: ${{ secrets.SLACK_CANVAS_ID_SEUNGHOO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKFILL_START_DATE: ${{ github.event.inputs.start_date }}
          BACKFILL_END_DATE: ${{ github.event.inputs.end_date }}
          BACKFILL_FORCE: ${{ github.event.inputs.force }}
        run: |
          TYPE="${{ github.event.inputs.pipeline_type }}"
          echo "🚀 [트리거 실행] 선택된 파이프라인: $TYPE"
          if [ "$TYPE" = "weekly" ]; then
            node -e "require('./src/app').executeWeeklyPipeline()"
          elif [ "$TYPE" = "weekly-resend" ]; then
            node -e "require('./src/app').executeWeeklyPipeline(true)"
          elif [ "$TYPE" = "weekly-reminder" ]; then
            node -e "require('./src/app').executeWeeklyReminderPipeline()"
          elif [ "$TYPE" = "weekly-late-audit" ]; then
            node -e "require('./src/app').executeWeeklyLateLogAuditPipeline().catch(e => { console.error(e); process.exit(1); })"
          elif [ "$TYPE" = "smartfarm-weekly" ]; then
            node -e "require('./src/app').executeSmartfarmWeeklyPipeline().catch(e => { console.error(e); process.exit(1); })"
          elif [ "$TYPE" = "daily-reminder" ]; then
            node -e "require('./src/app').executeDailyReminderPipeline()"
          elif [ "$TYPE" = "daily-backfill" ]; then
            if [ -z "$BACKFILL_START_DATE" ]; then
              echo "❌ daily-backfill 에는 start_date 입력이 필요합니다."; exit 1
            fi
            node -e "require('./src/app').executeDailyBackfillPipeline(process.env.BACKFILL_START_DATE, process.env.BACKFILL_END_DATE || process.env.BACKFILL_START_DATE, process.env.BACKFILL_FORCE !== 'false').catch(e => { console.error(e); process.exit(1); })"
          elif [ "$TYPE" = "overdue-tasks" ]; then
            node -e "require('./src/app').executeOverdueTasksReminderPipeline()"
          elif [ "$TYPE" = "project-sync" ]; then
            node -e "require('./src/app').executeProjectStatusSyncPipeline()"
          else
            node -e "require('./src/app').executeDailyPipeline()"
          fi

      - name: Commit and Push Archived Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 생성된 docs/ 폴더가 있다면 트래킹 추가
          git add docs/ || true
          
          # 변경사항이 있는 경우에만 커밋/푸시 진행
          if git diff --cached --quiet; then
            echo "📝 새롭게 저장할 마크다운 보고서가 없습니다."
          else
            echo "📝 새 마크다운 보고서를 깃허브 저장소에 기록합니다."
            git commit -m "chore: [자동 아카이브] 일일/주간 업무 보고서 보존"
            # 동시 실행된 다른 런이 먼저 푸시했을 수 있으므로, 최신으로 맞춘 뒤 푸시 (최대 3회 재시도)
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "⚠️ 푸시 충돌 감지 - 재시도 ($i/3)"
              sleep 5
            done
          fi
